name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest --version "${{ matrix.ruby == '4.0' && '5.27.0' || '5.15.0' }}" --no-document
      - run: ruby -Ilib:test test/run.rb
      - run: gem build ai-lite.gemspec
