name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '2.7', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest --version 5.15.0 --no-document
      - run: ruby -Ilib:test test/run.rb
      - run: gem build ai-lite.gemspec
